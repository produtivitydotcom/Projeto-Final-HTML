<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCADE — Filmes para todos</title>

  <!-- fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- estilo -->
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <!-- ===== MENU ===== -->
  <header class="topo">
    <a href="index.html" class="logo">ARCADE</a>
    <nav class="menu">
      <a href="index.html" class="ativo">Início</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="perfil.html">Minha Conta</a>
    </nav>
    <a href="catalogo.html" class="botao-busca">Explorar filmes</a>
  </header>

  <!-- ===== DESTAQUE — preenchido pelo JavaScript ===== -->
  <section id="destaque" class="destaque"></section>

  <!-- ===== FILEIRAS — preenchidas pelo JavaScript ===== -->
  <main id="fileiras" class="fileiras"></main>

  <!-- ===== RODAPÉ ===== -->
  <footer class="rodape">
    <p>ARCADE — cinema clássico e cult em domínio público.</p>
    <p class="rodape-fraco">Conheça outras culturas assistindo.</p>
  </footer>

  <!-- carrega o catálogo (o mesmo dados/filmes.json usado por catalogo.html e filme.html)
       e adapta os campos que o home.js espera antes de chamá-lo -->
  <script>
    async function carregarFilmes() {
      const resposta = await fetch('dados/filmes.json');
      const filmes = await resposta.json();

      return filmes.map(filme => ({
        ...filme,
        generos: [filme.genero],
        banner: filme.banner || filme.capa,
        ano: filme.ano || 'Clássico',
        sinopse: filme.sinopse || `Acompanhe a obra clássica "${filme.titulo}", um marco do cinema.`
      }));
    }

    function mostrarErro(container, erro) {
      console.error('Erro ao carregar o catálogo:', erro);
      container.innerHTML = `
        <p style="padding: 40px 48px; color: var(--texto-fraco);">
          Não foi possível carregar o catálogo agora. Tente novamente mais tarde.
        </p>
      `;
    }
  </script>
  <script src="js/home.js"></script>
</body>
</html>
