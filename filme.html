<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade — Detalhes do Filme</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilo.css">

  <style>
    .filme-detalhe-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .hero-filme {
      display: flex;
      gap: 40px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .capa-destaque {
      width: 280px;
      height: 410px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    .info-destaque {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .titulo-filme {
      font-family: 'Cinzel', serif;
      font-size: 2.4rem;
      margin: 0 0 10px 0;
      color: #fff;
    }

    .meta-tags {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tag {
      background: #27272a;
      color: #e4e4e7;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .sinopse {
      color: #a1a1aa;
      line-height: 1.6;
      font-size: 1rem;
      margin-bottom: 30px;
    }

    .acoes-filme {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-play {
      background: #eab308;
      color: #000;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1.05rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-play:hover {
      background: #facc15;
      transform: translateY(-2px);
    }

    .btn-acao {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    /* Estado visual quando o filme está salvo nos favoritos/assistir depois */
    .btn-acao.ativo {
      background: #eab308 !important;
      border-color: #eab308 !important;
      color: #000 !important;
    }

    @media (max-width: 768px) {
      .hero-filme {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .meta-tags, .acoes-filme {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header class="topo">
    <a href="index.html" class="logo">Arcade</a>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="perfil.html">Minha Conta</a>
    </nav>
  </header>

  <main class="filme-detalhe-container">
    <div class="hero-filme">
      <img id="filme-capa" src="" alt="Capa do filme" class="capa-destaque">
      
      <div class="info-destaque">
        <div>
          <h1 id="filme-titulo" class="titulo-filme">Carregando...</h1>
          
          <div class="meta-tags">
            <span id="filme-genero" class="tag">Gênero</span>
            <span id="filme-pais" class="tag">País</span>
            <span id="filme-ano" class="tag">Ano</span>
          </div>

          <p id="filme-sinopse" class="sinopse">
            A carregar dados do filme...
          </p>
        </div>

        <div class="acoes-filme">
          <a id="btn-assistir-agora" href="#" class="btn-play">
            ▶️ Assistir Agora
          </a>

          <button id="btn-favorito" class="btn-acao">
            ❤️ Favoritos
          </button>

          <button id="btn-depois" class="btn-acao">
            🔖 Assistir Depois
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let filmeAtual = null;

    async function carregarDetalhesFilme() {
      // 1. Pega o ID da URL
      const urlParams = new URLSearchParams(window.location.search);
      const idFilme = urlParams.get('id');

      try {
        const resposta = await fetch('dados/filmes.json');
        const filmes = await resposta.json();

        // 2. Procura pelo ID (comparando como String e Number para evitar divergências de tipo)
        filmeAtual = filmes.find(f => String(f.id) === String(idFilme)) || filmes[0];

        if (!filmeAtual) return;

        // 3. Preenche na interface
        document.getElementById('filme-capa').src = filmeAtual.capa || '';
        document.getElementById('filme-capa').alt = filmeAtual.titulo || 'Filme';
        document.getElementById('filme-titulo').innerText = filmeAtual.titulo || 'Sem Título';
        document.getElementById('filme-genero').innerText = filmeAtual.genero || 'Gênero';
        document.getElementById('filme-pais').innerText = filmeAtual.pais || 'Internacional';
        document.getElementById('filme-ano').innerText = filmeAtual.ano || 'Clássico';
        
        document.getElementById('filme-sinopse').innerText = filmeAtual.sinopse || 
          `Acompanhe a obra clássica "${filmeAtual.titulo}", um importante marco do cinema.`;

        // Link do Player
        document.getElementById('btn-assistir-agora').href = `player.html?id=${filmeAtual.id}`;

        // 4. Salva no histórico de "Continuar Assistindo"
        registrarNoHistorico(filmeAtual);

        // 5. Atualiza as cores dos botões de Favorito e Assistir Depois
        atualizarEstadoBotoes();

      } catch (erro) {
        console.error("Erro ao carregar dados do filme:", erro);
      }
    }

    // Registra no histórico para a página de perfil
    function registrarNoHistorico(filme) {
      if (!filme || !filme.id) return;
      let historico = JSON.parse(localStorage.getItem('arcade_historico')) || [];
      historico = historico.filter(f => String(f.id) !== String(filme.id));
      historico.unshift(filme);
      localStorage.setItem('arcade_historico', JSON.stringify(historico));
    }

    // Alterna a inclusão do filme no LocalStorage
    function alternarLista(chave) {
      if (!filmeAtual || !filmeAtual.id) return;

      let lista = JSON.parse(localStorage.getItem('arcade_' + chave)) || [];
      const existeIndex = lista.findIndex(f => String(f.id) === String(filmeAtual.id));

      if (existeIndex !== -1) {
        lista.splice(existeIndex, 1); // Remove se já existir
      } else {
        lista.push(filmeAtual); // Adiciona
      }

      localStorage.setItem('arcade_' + chave, JSON.stringify(lista));
      atualizarEstadoBotoes();
    }

    // Atualiza o visual dos botões
    function atualizarEstadoBotoes() {
      if (!filmeAtual) return;

      const favoritos = JSON.parse(localStorage.getItem('arcade_favoritos')) || [];
      const depois = JSON.parse(localStorage.getItem('arcade_assistirDepois')) || [];

      const ehFavorito = favoritos.some(f => String(f.id) === String(filmeAtual.id));
      const ehDepois = depois.some(f => String(f.id) === String(filmeAtual.id));

      const btnFav = document.getElementById('btn-favorito');
      const btnDep = document.getElementById('btn-depois');

      if (ehFavorito) {
        btnFav.classList.add('ativo');
        btnFav.innerText = '❤️ Nos Favoritos';
      } else {
        btnFav.classList.remove('ativo');
        btnFav.innerText = '❤️ Favoritos';
      }

      if (ehDepois) {
        btnDep.classList.add('ativo');
        btnDep.innerText = '🔖 Salvo p/ Depois';
      } else {
        btnDep.classList.remove('ativo');
        btnDep.innerText = '🔖 Assistir Depois';
      }
    }

    // Eventos de clique nos botões
    document.getElementById('btn-favorito').addEventListener('click', () => alternarLista('favoritos'));
    document.getElementById('btn-depois').addEventListener('click', () => alternarLista('assistirDepois'));

    // Inicia o carregamento ao abrir a página
    carregarDetalhesFilme();
  </script>

</body>
</html>
