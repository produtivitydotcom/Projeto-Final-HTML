<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade — Entrar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilo.css">

  <style>
    .login-container {
      max-width: 420px;
      margin: 80px auto;
      padding: 0 20px;
    }
    .login-titulo {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #fff;
      text-align: center;
    }
    .login-subtitulo {
      color: var(--texto-fraco);
      text-align: center;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }
    .login-form {
      background: var(--superficie);
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .campo-grupo label {
      display: block;
      font-size: 0.85rem;
      color: var(--texto-fraco);
      margin-bottom: 6px;
    }
    .campo-grupo input {
      width: 100%;
      background: var(--fundo);
      border: 1px solid var(--borda);
      color: var(--texto);
      padding: 12px 14px;
      border-radius: 8px;
      font-family: var(--fonte-texto);
      font-size: 0.95rem;
      outline: none;
    }
    .campo-grupo input:focus {
      border-color: var(--ambar);
    }
    .btn-entrar {
      background: var(--ambar);
      color: #121214;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-entrar:hover {
      background: var(--ambar-forte);
    }
    .login-erro {
      color: #f87171;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <header class="topo">
    <a href="index.html" class="logo">ARCADE</a>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="sobre.html">Missão</a>
      <a href="perfil.html" class="link-conta">Minha Conta</a>
    </nav>
  </header>

  <main class="login-container">
    <h1 class="login-titulo">Entrar no Arcade</h1>
    <p class="login-subtitulo">Informe seu nome e e-mail para acessar seus favoritos e sua lista de assistir depois.</p>

    <form id="form-login" class="login-form">
      <div class="campo-grupo">
        <label for="campo-nome">Nome</label>
        <input type="text" id="campo-nome" name="nome" placeholder="Seu nome" autocomplete="name" required>
      </div>

      <div class="campo-grupo">
        <label for="campo-email">E-mail</label>
        <input type="email" id="campo-email" name="email" placeholder="seu@email.com" autocomplete="email" required>
      </div>

      <p id="login-erro" class="login-erro">Preencha nome e e-mail válidos para continuar.</p>

      <button type="submit" class="btn-entrar">Entrar</button>
    </form>
  </main>

  <script src="js/login.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
