<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade — Minha Conta</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/estilo.css">

  <style>
    .perfil-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .card-usuario {
      background: #18181b;
      border: 1px solid #27272a;
      padding: 24px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }
    .avatar {
      width: 70px;
      height: 70px;
      background: #eab308;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
    }
    .secao-titulo {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      margin: 30px 0 15px 0;
      color: #f4f4f5;
    }
    .grade-minhas-listas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .vazio-txt {
      color: #71717a;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header class="topo">
    <a href="index.html" class="logo">Arcade</a>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="perfil.html" class="ativo">Minha Conta</a>
    </nav>
  </header>

  <main class="perfil-container">
    <div class="card-usuario">
      <div class="avatar">K</div>
      <div>
        <h2 style="margin:0; font-size: 1.3rem;">Usuário Arcade</h2>
        <p style="margin: 4px 0 0 0; color: #a1a1aa;">kami1120903@icloud.com • Plano Premium</p>
      </div>
    </div>

    <h3 class="secao-titulo">🕒 Continuar Assistindo</h3>
    <div class="grade-minhas-listas" id="lista-historico"></div>

    <h3 class="secao-titulo">❤️ Meus Favoritos</h3>
    <div class="grade-minhas-listas" id="lista-favoritos"></div>

    <h3 class="secao-titulo">🔖 Assistir Depois</h3>
    <div class="grade-minhas-listas" id="lista-depois"></div>
  </main>

  <script>
    function renderizarLista(chaveStorage, elementoId) {
      const conteiner = document.getElementById(elementoId);
      const lista = JSON.parse(localStorage.getItem(chaveStorage)) || [];

      if (lista.length === 0) {
        conteiner.innerHTML = `<p class="vazio-txt">Nenhum filme salvo aqui ainda.</p>`;
        return;
      }

      conteiner.innerHTML = lista.map(filme => `
        <a href="player.html?id=${filme.id}" style="text-decoration: none; color: inherit;">
          <div class="card-filme">
            <img src="${filme.capa}" alt="${filme.titulo}" style="width: 100%; border-radius: 8px;">
            <div class="card-filme-info" style="padding: 8px 0;">
              <h4 style="margin:0; font-size: 0.95rem;">${filme.titulo}</h4>
              <span style="font-size: 0.8rem; color: #a1a1aa;">${filme.genero}</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    // Carrega as listas na tela do perfil
    renderizarLista('arcade_historico', 'lista-historico');
    renderizarLista('arcade_favoritos', 'lista-favoritos');
    renderizarLista('arcade_assistirDepois', 'lista-depois');
  </script>

</body>
</html>
